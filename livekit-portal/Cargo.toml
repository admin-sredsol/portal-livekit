[package]
name = "livekit-portal"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[dependencies]
# The core crate with the native (LiveKit SDK) transport enabled. This crate
# is a thin facade — all items are re-exported from `livekit-portal-core`,
# preserving every existing `livekit_portal::…` import path. On wasm, depend
# on `livekit-portal-core` (default features) with a JS transport instead.
# `rustls-tls-native-roots` (set on core's `livekit` dep): livekit's default
# feature set doesn't enable any TLS backend (its comment: "By default ws TLS
# is not enabled"). Without this the signal client's HTTPS requests
# (/settings/regions, the WSS upgrade) fail against LiveKit Cloud. Matches
# livekit-ffi's default.
livekit-portal-core = { path = "../livekit-portal-core", features = ["native"] }